# SIMULATED railway network model for the demo. NOT official data.
#  * Distances are rounded public approximations, for display only.
#  * recovery_allowance_min = minutes a late train can typically win back on that section. These numbers
#    are INVENTED placeholders: real values would come from the working timetable (allowances) or history.
#  * Train categories / priorities / coach types are for the simulated 90xxx trains only (verified: false).
#  * Bus entries are SAMPLE scenarios for demo mode only: not real timetables, fares or seats.
label: "Simulated route-section model (not official)"

sections:
  - {a: BPL,  b: JHS,  km: 291, recovery_allowance_min: 8}
  - {a: JHS,  b: AGC,  km: 215, recovery_allowance_min: 6}
  - {a: AGC,  b: NDLS, km: 195, recovery_allowance_min: 10}
  - {a: NDLS, b: UMB,  km: 199, recovery_allowance_min: 6}
  - {a: UMB,  b: CDG,  km: 45,  recovery_allowance_min: 2}
