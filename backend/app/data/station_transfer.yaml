  DDU:  {complexity: MEDIUM, walk_minutes: 20}
  PNBE: {complexity: MEDIUM, walk_minutes: 20}
  DBG:  {complexity: LOW, walk_minutes: 10}
  BPL:  {complexity: MEDIUM, walk_minutes: 18}
  UMB:  {complexity: MEDIUM, walk_minutes: 15}
  CDG:  {complexity: LOW, walk_minutes: 10}
  NZM:  {complexity: MEDIUM, walk_minutes: 15}
  AGC:  {complexity: MEDIUM, walk_minutes: 15}
