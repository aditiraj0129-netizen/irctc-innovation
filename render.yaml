services:
  - type: web
    name: agla-kadam
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: LLM_ENABLED
        value: "false"
      # Frontend and API share one address, so no cross-site (CORS) access is needed.
      # Set DEMO_TOKEN in the Render dashboard (not here) to protect the presenter controls.
      - key: DEMO_TOKEN
        sync: false
